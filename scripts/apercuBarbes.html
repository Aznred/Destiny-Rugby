<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barbes et moustaches · Aperçu local</title>
<style>
  body { margin: 0; background: #1b2420; color: #f5f7f2; font: 500 13px/1.3 system-ui, sans-serif; }
  header { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header a { color: #f0c04a; text-decoration: none; padding: 4px 8px; border: 1px solid rgba(240, 192, 74, .35); border-radius: 6px; }
  header a.actif { background: #f0c04a; color: #17130a; }
  main { display: grid; grid-template-columns: repeat(var(--colonnes, 4), minmax(0, 1fr)); gap: 6px; padding: 0 10px 10px; }
  figure { margin: 0; background: #cfd6d2; border-radius: 8px; overflow: hidden; }
  figure div { height: var(--hauteur, min(46vh, 340px)); }
  figcaption { padding: 4px 8px; background: #0f1512; color: #c7d1c6; font-size: 12px; }
  @media (max-width: 700px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<!--
  Banc visuel des barbes et moustaches (Correctif 25, points 1 à 3). Les deux têtes du jeu (arrière, avant), de face et de
  profil, avec la barbe demandée : /scripts/apercuBarbes.html?barbe=11   (01 moustache · 02-04 bouc · 05-10 courte · 11-15 longue)
  &coupe=07 pour une coiffure, &peau=#c68642 pour le teint, &angle=0.6 pour un trois-quarts à la place du profil.
-->
<header id="choix"></header>
<main id="grille"></main>
<script type="module">
  const p = new URLSearchParams(location.search);
  const barbe = p.get('barbe') ?? '11';
  // &gros=1 : deux colonnes et des cadres hauts, pour regarder la mâchoire de près.
  if (p.has('gros')) { document.documentElement.style.setProperty('--colonnes', '2'); document.documentElement.style.setProperty('--hauteur', (p.get('hauteur') ?? '640') + 'px'); }
  const choix = document.getElementById('choix');
  for (let n = 1; n <= 15; n++) {
    const id = String(n).padStart(2, '0');
    const a = document.createElement('a');
    const q = new URLSearchParams(p); q.set('barbe', id);
    a.href = '?' + q; a.textContent = id; if (id === barbe) a.className = 'actif';
    choix.append(a);
  }
  // Comme le jeu (`lib/match3D.ts`) : le lecteur vit dans public/, une balise le charge tel quel et il s'annonce.
  const lecteur = await new Promise((resolve, reject) => {
    globalThis.addEventListener('destiny-scene3d', () => resolve(globalThis.__destinyRugbyScene3D), { once: true });
    const balise = document.createElement('script');
    balise.type = 'module'; balise.src = '/rn26/chargeur.js'; balise.onerror = reject;
    document.head.append(balise);
  });
  const apparence = { barbeId: barbe, coupeId: p.get('coupe') ?? '03', peau: p.get('peau') ?? '#c99672', cheveux: '#2a1c12', couleurBarbe: p.get('teinte') ?? '#3a2616' };
  const vues = [['Arrière · face', false, 0], ['Arrière · profil', false, Number(p.get('angle') ?? Math.PI / 2)], ['Avant · face', true, 0], ['Avant · profil', true, Number(p.get('angle') ?? Math.PI / 2)]];
  globalThis.__barbes = [];
  for (const [titre, avant, angle] of vues) {
    const figure = document.createElement('figure'), cadre = document.createElement('div'), legende = document.createElement('figcaption');
    legende.textContent = `${titre} · barbe ${barbe}`;
    figure.append(cadre, legende); document.getElementById('grille').append(figure);
    globalThis.__barbes.push(await lecteur.creerApercuJoueur(cadre, { avant, apparence, cadrage: 'visage', angle }));
  }
  document.title = `Barbe ${barbe} · prêt`;
</script>
</body>
</html>
